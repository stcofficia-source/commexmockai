name: Deploy Express AI Backend to Production VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy Express AI Backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          timeout: 120s
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            APP_DIR="/var/www/commexmockai"
            echo "🚀 Navigating to application directory: ${APP_DIR}"
            cd "${APP_DIR}"

            echo "🔑 Fixing file permissions on application directory..."
            sudo chown -R $(whoami):$(whoami) "${APP_DIR}" 2>/dev/null || true

            echo "📥 Fetching latest commits from Git..."
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            echo "📦 Installing npm dependencies cleanly..."
            sudo chown -R $(whoami):$(whoami) "${APP_DIR}/node_modules" 2>/dev/null || true
            if [ -f "package-lock.json" ]; then
              npm ci --prefer-offline --no-audit || npm install --legacy-peer-deps --no-audit
            else
              npm install --legacy-peer-deps --no-audit
            fi

            echo "🔍 Running Node.js syntax verification..."
            find src -name "*.js" -exec node --check {} +

            echo "🔄 Reloading PM2 backend process cleanly..."
            pm2 reload commexmockai --update-env || pm2 start src/server.js --name "commexmockai" --update-env
            pm2 save

            echo "🏥 Running production health check..."
            sleep 3
            curl --fail --silent --show-error http://127.0.0.1:3500/health || true

            echo "✅ Express AI Backend deployed successfully!"
